  <head>

    <meta name="description" content="Carrito de compras Bulltecno" />

    <header class="cart-header"><a class="logo" href="index.html"><span>BULL</span>TECNO<i></i></a><a class="back-link" href="index.html">← Seguir comprando</a></header>

        <form id="order-form" novalidate>
          <p class="form-error" id="form-error" role="alert"></p><p class="whatsapp-label">Enviar pedido por WhatsApp:</p><button class="checkout-button" type="button" data-phone="5493794638380">Confirmar con Facundo</button><button class="checkout-button secondary" type="button" data-phone="5493794949990">Confirmar con Nicolás</button>
        </form>
